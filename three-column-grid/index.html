<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>three-column-grid</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="{showList: false}">
    <header>
        <nav>
            <ul>
                <li>Home</li>
            </ul>
        </nav>
        <button
            class="list-btn"
            @click="showList = !showList"
        >View</button>
    </header>
    <main>
        <div class="filter">
            <h3>filter</h3>
        </div>
        <div class="content">
            <h3>content</h3>
        </div>
        <div
            class="list"
            :class="showList ? 'open' : ''"
        >
            <h3>a list</h3>
        </div>
    </main>
    <script src="./main.js"></script>
</body>
</html>
