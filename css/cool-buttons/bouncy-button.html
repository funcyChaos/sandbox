    <style>
        .ctaPrimary, .ctaSecondary {
    cursor: pointer;
    -webkit-appearance: none;
    -moz-appearance: none;
    --horizontal-padding: calc(24*.0625rem);
    --vertical-padding: calc(12*.0625rem);
    text-align: center;
    box-sizing: border-box;
    color: #231e15;
    background: 0 0;
    background: rgba(35,30,21,0);
    font-family: Graphik Web,Helvetica Neue,Helvetica,Arial,Verdana,sans-serif;
    /* padding: var(--vertical-padding)var(--horizontal-padding); */
    border-radius: 10px;
    -webkit-box-shadow: 0 0 0 calc(1*.0625rem) #231e15;
    box-shadow: 0 0 0 calc(1*.0625rem) #231e15;
    border: none;
    text-decoration: none;
    transition: transform .3s cubic-bezier(.5,2.5,.7,.7),box-shadow .3s cubic-bezier(.5,2.5,.7,.7);
    display: inline-block;
    position: relative;
    transform: translateY(0);
}
.ctaPrimary:hover, .ctaSecondary:hover {
    background: var(--cta-hovered-background-color,rgba(35,30,21,0));
    color: var(--cta-hovered-text-color,#231e15);
    -webkit-box-shadow: 0 0 0 calc(1*.0625rem) #231e15,0 var(--animation-depth,.375em)0 0 #231e15;
    box-shadow: 0 0 0 calc(1*.0625rem) #231e15,0 var(--animation-depth,.375em)0 0 #231e15;
    -webkit-transform: translateY(calc(-1*var(--animation-depth,.375em)));
    -ms-transform: translateY(calc(-1*var(--animation-depth,.375em)));
    transform: translateY(calc(-1*var(--animation-depth,.375em)));
}
    </style>
</head>
<body>
    <a href="" class="ctaSecondary">hover over me</a>
</body>
</html>
