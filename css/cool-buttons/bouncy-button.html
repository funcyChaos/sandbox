<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy Button</title>
    <style>
        .container{
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bouncyButton{
            cursor: pointer;
            text-align: center;
            border-radius: 30px;
            box-shadow: 0 0 0 .0635rem #231e15;
            transition:
                transform .3s cubic-bezier(.5,2.5,.7,.7),
                box-shadow .3s cubic-bezier(.5,2.5,.7,.7);
        }
        .bouncyButton:hover{
            box-shadow: 0 0 0 .0625rem #231e15,0 .375em 0 0 #231e15;
            transform: translateY(-.375em);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="" class="bouncyButton" style="padding: 20px;">hover over me</a>
    </div>
</body>
</html>
