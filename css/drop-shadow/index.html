<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Shadow</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: white;
            filter: drop-shadow(0 0 4px black);
        }
    </style>
</head>
<body>
    <div class="box">
        Way better than box shadow
    </div>
</body>
</html>
