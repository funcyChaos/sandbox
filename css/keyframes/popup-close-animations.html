<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Close Animations</title>
</head>
<style>
    body{
        margin: 0;
        height: 100vh;
        background-color: black;
    }
    .popup{
        position: absolute;
        left: 300px;
        top: 200px;
        height: 300px;
        width: 200px;
        background-color: gray;
        transform-style: preserve-3d;
    }
    .popup.closing{
        animation: magicCarpet .5s ease-in-out forwards;
    }
    @keyframes magicCarpet{
        0%{
            opacity: 1;
        }
        100%{
            /* transform: perspective(300px) rotateY(-60deg) rotateX(40deg) translate3d(50px, -400px, -100px); */
            /* transform: perspective(400px)  rotateX(20deg) rotateY(-70deg) rotateZ(45deg) translate3d(50px, -400px, -100px); */
            transform: perspective(400px)  rotateX(20deg) rotateY(-70deg) rotateZ(45deg) translate3d(-100px, -400px, -20px);
            opacity: 0;
        }
    }

<body>
    <div class="popup"></div>
    <script>
        const popup = document.querySelector('.popup')

            popup.classList.toggle('closing')
