<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Click</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }
    body{
        background-color: #dfe8f1;
    }
    #context-menu{
        background-color: black;
        box-shadow: 0 0 20px gray;
        color: white;
        width: 150px;
        font-size: 18px;
        position: fixed;
        /* visibility: hidden; */
    }
    .item{
        padding: 5px 0 5px 20px;
    }
    .item:hover{
        background-color: #333;
        cursor: pointer;
    }
    .item:first-child{
        border-radius: 0 5px 0 0;
    }
</style>
<body>
    <div id="context-menu">
        <div class="item">View</div>
        <div class="item">Refresh</div>
        <div class="item">Copy</div>
        <div class="item">Customize</div>
        <div class="item">Save As</div>
    </div>
    <script>
        const contextMenu       = document.getElementById('context-menu');
        document.addEventListener('contextmenu', e=>{
            e.preventDefault()
            console.log("Not your context menu")
            const mouseX        = e.clientX
            const mouseY        = e.clientY
            const menuHeight    = contextMenu.getBoundingClientRect().height
            const menuWidth     = contextMenu.getBoundingClientRect().width
            console.log(menuWidth)
            const width         = window.innerWidth
            const height        = window.innerHeight
            if(width - mouseX <= 150){
                contextMenu.style.borderRadius      = "5px 0 5px 5px";
                contextMenu.style.left              = width - 150 + 'px'
                contextMenu.style.top               = mouseY + "px";
                //right bottom
                if(height - mouseY <= 160){
                    contextMenu.style.top           = mouseY - menuHeight + "px";
                    contextMenu.style.borderRadius  = "5px 5px 0 5px";
                }
            }else{
                contextMenu.style.borderRadius      = "0 5px 5px 5px";
                contextMenu.style.left              = mouseX + "px";
                contextMenu.style.top               = mouseY + "px";
                //left bottom
                if(height - mouseY <= 160){
                    contextMenu.style.top           = mouseY - menuHeight + "px";
                    contextMenu.style.borderRadius  = "5px 5px 5px 0";
                }
            }
            contextMenu.style.visibility            = "visible";
        },{passive: false})
        document.addEventListener('click', e=>{
            if(!contextMenu.contains(e.target)){
                contextMenu.style.visibility        = 'hidden'
            }
        })
    </script>
</body>
</html>
