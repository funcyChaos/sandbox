<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragging</title>
    <style>
        .draggable{
            height: 100px;
            width: 100px;
            background-color: blue;
            position: absolute;
            touch-action: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="draggable"></div>
    <script>
        const dragItem = document.querySelector('.draggable')
        let isDragging = false;
        let offsetX, offsetY;
        const originalLeft = dragItem.offsetLeft
        const originalTop = dragItem.offsetTop
        dragItem.addEventListener('mousedown', e=>{
          setDraggableStart(e.clientX, e.clientY)
        })
        document.addEventListener('mousemove', e=>{
          setDraggablePosition(e.clientX, e.clientY)
        })
        document.addEventListener('mouseup', ()=>{
          setDraggableOriginal()
        })

        dragItem.addEventListener('touchstart', e=>{
          const touch = e.touches[0]
          setDraggableStart(touch.clientX, touch.clientY)
        })
        dragItem.addEventListener('touchmove', e=>{
          e.preventDefault(); 
          const touch = e.touches[0]
          setDraggablePosition(touch.clientX, touch.clientY)
        })
        dragItem.addEventListener('touchend', e=>{
          setDraggableOriginal()
        })

        function setDraggableStart(x, y){
          isDragging = true
          offsetX = x - dragItem.getBoundingClientRect().left
          offsetY = y - dragItem.getBoundingClientRect().top
          setTimeout(()=>{
            if(isDragging){
              dragItem.style.backgroundColor = 'pink'
            }
          }, 120)
        }
        function setDraggablePosition(x, y){
          if(!isDragging)return
          dragItem.style.left   = `${x - offsetX}px`
          dragItem.style.top    = `${y - offsetY}px`
        }
        function setDraggableOriginal(){
          if(!isDragging)return
          isDragging = false
          dragItem.style.backgroundColor = 'blue'
          dragItem.style.left   = `${originalLeft}px`
          dragItem.style.top    = `${originalTop}px`
        }
    </script>
</body>
</html>
